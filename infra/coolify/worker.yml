version: '3.9'

services:
  worker:
    image: bharatleads/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f workers/dist/index.js']
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
